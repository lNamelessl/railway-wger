# Railway wrapper nginx config for wger (derived from the upstream
# wger-project/docker config/nginx.conf at the pinned digest, minus the
# PowerSync proxy). Rendered to /home/wger/nginx-temp/nginx.conf at boot
# with the listen port substituted; nginx runs as the unprivileged wger user,
# so all writable state (pid, temp dirs) lives under /home/wger/nginx-temp.

daemon off;
worker_processes auto;
pid /home/wger/nginx-temp/nginx.pid;
# "stderr" is nginx's special value for the process's standard error; a real
# /dev/stderr path fails with EACCES for the non-root wger user.
error_log stderr info;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    client_body_temp_path /home/wger/nginx-temp/client_body;
    proxy_temp_path       /home/wger/nginx-temp/proxy;
    fastcgi_temp_path     /home/wger/nginx-temp/fastcgi;
    uwsgi_temp_path       /home/wger/nginx-temp/uwsgi;
    scgi_temp_path        /home/wger/nginx-temp/scgi;

    # Allow video uploads
    client_max_body_size 100M;

    upstream wger {
        server 127.0.0.1:8000;
    }

    # Recover the real client IP behind Railway's edge proxy so Django Axes
    # locks out attackers, not everyone.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map $http_x_forwarded_proto $final_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen __WGER_LISTEN__;

        # Healthcheck target. Railway strips the trailing slash from
        # healthcheckPath (/api/v2/version); rewrite it back to Django's
        # canonical /api/v2/version/ so the probe gets a plain 200 instead
        # of a redirect.
        location = /api/v2/version {
            proxy_pass http://wger/api/v2/version/;
            proxy_set_header Host $http_host;
        }

        location /static/ {
            root /home/wger;
            add_header Cache-Control "no-cache" always;
            add_header Vary "Accept-Encoding" always;
            location ~ "\.[0-9a-f]{12}\.[^./]+$" {
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                add_header Vary "Accept-Encoding" always;
            }
        }

        # The Railway wrapper keeps the generated JWT keypair in the media
        # volume root (the only persistent path); it must never be served.
        location = /media/jwt-keys.env {
            deny all;
        }

        location /media/ {
            alias /home/wger/media/;
        }

        location / {
            proxy_pass http://wger;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $final_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
